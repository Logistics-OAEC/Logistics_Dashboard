<!-- Company Selection -->
<div style="margin-bottom: 12px;">
  <label style="font-weight: 600; display: block; margin-bottom: 4px;">Company *</label>
  <select id="companySelect" onchange="toggleOtherCompanyInput()" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" required>
    <option value="">Select Company...</option>
    <option value="UBI">UBI</option>
    <option value="OAEC">OAEC</option>
    <option value="OTHER RENTAL">OTHER RENTAL</option>
  </select>
</div>

<!-- Hidden input field triggered when 'OTHER RENTAL' is selected -->
<div id="otherCompanyContainer" style="display: none; margin-bottom: 12px;">
  <label style="font-weight: 600; display: block; margin-bottom: 4px;">Specify Other Rental Company *</label>
  <input type="text" id="otherCompanyInput" placeholder="e.g. ABC Heavy Equipment Rental" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
</div>
